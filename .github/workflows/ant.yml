# This workflow will build a Java project with Ant
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-ant

#
# Manual runs only: build.xml (from donor franksorensen) defaults to the ivypublish target, which needs
# ../ivysetup/ivysettings.xml, ../ivysetup/ivyproperties.properties and the maven-resolver Ant library
# in lib/ - an Ivy setup that exists only on the donor's machine. On a runner it fails with
# "failed to create task or type antlib:org.apache.maven.resolver.ant:pom". maven.yml is the CI build.

name: Java CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Build with Ant
      run: ant -noinput -buildfile build.xml
